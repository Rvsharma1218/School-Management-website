name: school_web
description: School & Computer Institute Student Management App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Firebase
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.4
  cloud_firestore: ^5.5.0
  firebase_storage: ^12.3.6

  # Database
  sqflite: ^2.3.3
  sqflite_common_ffi: ^2.3.3
  sqflite_common_ffi_web: ^0.4.0
  path: ^1.9.0

  # PDF generation
  pdf: ^3.10.8
  printing: ^5.12.0

  # Excel export
  excel: ^4.0.3

  # Zip/xlsx byte-level repair (used to sanitize corrupt shared-strings
  # tables before handing files to the `excel` package — see
  # core/utils/excel_cell_reader.dart -> sanitizeXlsxBytes)
  archive: ^3.6.1

  # Image picker
  image_picker: ^1.1.2

  # QR Code
  qr_flutter: ^4.1.0

  # WhatsApp / URL launch
  url_launcher: ^6.3.0

  # Date formatting
  intl: ^0.19.0

  # File system
  path_provider: ^2.1.3

  # Share files
  share_plus: ^12.0.2

  # Notifications
  flutter_local_notifications: ^17.2.2

  # Google Fonts
  google_fonts: ^6.2.1

  # Image display

  # UUID generation
  uuid: ^4.4.2

  # Shared preferences (settings storage)
  shared_preferences: ^2.3.2

  # File picker
  file_picker: ^8.1.2

  # Flutter SVG (icons)
  flutter_svg: ^2.0.10+1

  # Lottie animations
  lottie: ^3.1.2

  # Dotted border
  dotted_border: ^2.1.0

  # Shimmer loading
  shimmer: ^3.0.0

  # Charts
  fl_chart: ^0.68.0

  # QR Code Scanner
  mobile_scanner: ^5.2.3

  # PDF text extraction (for import)
  syncfusion_flutter_pdf: ^27.1.48

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/fonts/
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#1565C0"
  adaptive_icon_foreground: "assets/images/app_icon.png"
  web:
    generate: false
  windows:
    generate: false
  macos:
    generate: false